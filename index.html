<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Componentes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ElectroParts</h1>
<div id="auth-section" class="auth-container">
    <input type="text" id="username-input" placeholder="Nombre de usuario" minlength="3" maxlength="30" autocomplete="username" required />
    <input type="password" id="password-input" placeholder="Contraseña" minlength="6" autocomplete="current-password" required />
    <button onclick="window.manejarAuth()">Iniciar Sesión</button>
    <button onclick="window.alternarModo()" style="background: #6c757d;" id="btn-modo">Registrarse</button>
</div>
        <div id="user-info">
            <span id="saludo-usuario"></span>
            <button onclick="window.cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>
    
    <div class="main-layout">
        <div class="container">
            <h2>Catalogo de Productos</h2>
            <label class="category-filter" for="filtro-categoria">
                Categoría:
                <select id="filtro-categoria">
                    <option value="todas">Todas</option>
                </select>
            </label>
            <div id="contenedor" class="grid">
                <p>Cargando productos...</p>
            </div>
        </div>

        <div class="cart-sidebar">
            <h3>Carrito de Compras</h3>
            <ul id="lista-carrito" class="cart-items">
                <p style="color: #777; font-size: 14px;">El carrito está vacío</p>
            </ul>
            <div class="cart-total">
                <span>Total:</span>
                <span id="total-pagar">$0.00</span>
            </div>
            <button id="btn-pagar" class="btn-pagar" style="display: none;" onclick="window.procesarPago()">Proceder al Pago</button>
        </div>
    </div>

    <button id="btn-nueva-conversacion" type="button" aria-label="Borrar conversación">
        Borrar conversación
    </button>

    <script>
        sessionStorage.clear()

        document.getElementById('btn-nueva-conversacion').addEventListener('click', () => {
            const confirmar = window.confirm('¿Quieres borrar la conversación y comenzar de nuevo?')

            if (confirmar) {
                sessionStorage.clear()
                window.location.reload()
            }
        })
    </script>
    <script type="module" src="app.js"></script>
    <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/11/02/09/20261102092353-6EX7TO58.js" defer></script>
</body>
</html>
